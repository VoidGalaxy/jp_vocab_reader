<svg xmlns="http://www.w3.org/2000/svg" width="32" height="300" viewBox="0 0 32 300" preserveAspectRatio="none" role="presentation">
  <defs>
    <linearGradient id="strapBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c3f22" />
      <stop offset="18%" stop-color="#7a5530" />
      <stop offset="48%" stop-color="#8f6a3f" />
      <stop offset="52%" stop-color="#8f6a3f" />
      <stop offset="82%" stop-color="#7a5530" />
      <stop offset="100%" stop-color="#4c3319" />
    </linearGradient>
    <radialGradient id="snapFace" cx="34%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#f4e0ae" />
      <stop offset="45%" stop-color="#d3a752" />
      <stop offset="100%" stop-color="#8a6338" />
    </radialGradient>
  </defs>

  <!-- Slightly irregular taper (hand-cut leather, not a straight rectangle) -->
  <path
    d="M12 1 C8 6 7 13 7.5 22 L6.5 258 C6 268 8 278 12 286 L20 286 C24 278 26 268 25.5 258 L24.5 22 C25 13 24 6 20 1 Z"
    fill="url(#strapBody)"
  />

  <!-- Hand-stitch lines, inset from each edge -->
  <path
    d="M10.5 12 L9.7 270"
    fill="none"
    stroke="rgba(244,224,174,0.4)"
    stroke-width="1"
    stroke-dasharray="3 3.5"
    stroke-linecap="round"
  />
  <path
    d="M21.5 12 L22.3 270"
    fill="none"
    stroke="rgba(244,224,174,0.4)"
    stroke-width="1"
    stroke-dasharray="3 3.5"
    stroke-linecap="round"
  />

  <!-- Soft center highlight, like light along a rounded leather edge -->
  <path
    d="M16 6 L15.6 280"
    fill="none"
    stroke="rgba(255,244,220,0.22)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Snap button -->
  <circle cx="16" cy="278" r="14.5" fill="url(#snapFace)" stroke="rgba(37,25,10,0.35)" stroke-width="1.2" />
  <circle cx="16" cy="278" r="4.2" fill="rgba(90,63,32,0.45)" />
  <circle cx="12.5" cy="273.5" r="3.6" fill="rgba(255,255,255,0.55)" />
</svg>
