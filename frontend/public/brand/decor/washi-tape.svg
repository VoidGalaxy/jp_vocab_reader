<svg xmlns="http://www.w3.org/2000/svg" width="84" height="30" viewBox="0 0 84 30" role="presentation">
  <!-- Deckled/torn edges (uneven zigzag, not a clean rectangle) plus a
       translucent color wash -- real washi tape is semi-transparent, so
       whatever sits underneath should show faintly through it. -->
